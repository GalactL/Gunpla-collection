name: Release

on:
  push:
    tags: ['v*.*.*']

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Le tag égale v + version de package.json
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/release-check.mjs
      - run: npm ci
      - run: npm test
      - name: Construire le zip
        env:
          TAG: ${{ github.ref_name }}
        run: >
          git archive --format=zip --prefix=gunpla-collection/ -o "gunpla-collection-$TAG.zip" "$TAG" --
          src public scripts demarrer.bat demarrer.sh package.json package-lock.json README.md LICENSE .gitattributes
      - name: Publier la Release
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          extra=()
          if [[ "$TAG" == *-* ]]; then extra+=(--prerelease); fi
          gh release create "$TAG" "gunpla-collection-$TAG.zip" --title "$TAG" --generate-notes --verify-tag "${extra[@]}"
